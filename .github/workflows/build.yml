name: Build Gor4akovNET APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK & NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install sagernet gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build gboxcore.aar (arm + arm64)
        working-directory: core
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.2.12479018"
          gomobile init
          go mod tidy
          go get github.com/sagernet/gomobile/bind@latest
          mkdir -p ../app/libs
          gomobile bind -v -androidapi 26 -target=android/arm,android/arm64 -trimpath -ldflags="-s -w" -o ../app/libs/gboxcore.aar .

      - name: Bundle Offline Router Payloads (.xz + AdGuardHome)
        run: |
          python3 - <<'PY'
          import urllib.request, gzip, lzma, json, hashlib, pathlib, tarfile, io, re, time

          base = pathlib.Path("app/src/main/assets/offline")
          (base / "entware").mkdir(parents=True, exist_ok=True)
          (base / "ipks").mkdir(parents=True, exist_ok=True)
          (base / "z2k").mkdir(parents=True, exist_ok=True)
          (base / "adguard").mkdir(parents=True, exist_ok=True)

          def fetch(url, retries=3):
              last = None
              for i in range(retries):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Gor4akovNET-CI/2.0"})
                      with urllib.request.urlopen(req, timeout=90) as r:
                          return r.read()
                  except Exception as e:
                      last = e
                      time.sleep(2 * (i + 1))
              raise RuntimeError(f"Failed {url}: {last}")

          def gz_to_xz(gz_bytes):
              raw_tar = gzip.decompress(gz_bytes)
              return lzma.compress(raw_tar, format=lzma.FORMAT_XZ, preset=9)

          manifest = {"entware": {}, "ipks": {}, "z2k": {}, "adguard": {}}

          # 1. Entware installers (repacked to .tar.xz to shrink APK, converted to .tar.gz on phone)
          entware_urls = {
              "aarch64-k3.10": ("aarch64-installer.tar.xz", "https://bin.entware.net/aarch64-k3.10/installer/aarch64-installer.tar.gz"),
              "mipselsf-k3.4": ("mipsel-installer.tar.xz", "https://bin.entware.net/mipselsf-k3.4/installer/mipsel-installer.tar.gz"),
              "mipssf-k3.4": ("mips-installer.tar.xz", "https://bin.entware.net/mipssf-k3.4/installer/mips-installer.tar.gz"),
          }
          for arch, (fname, url) in entware_urls.items():
              gz_data = fetch(url)
              xz_data = gz_to_xz(gz_data)
              out = base / "entware" / fname
              out.write_bytes(xz_data)
              manifest["entware"][arch] = {
                  "file": fname,
                  "size": len(xz_data),
                  "raw_gz_size": len(gz_data),
                  "sha256": hashlib.sha256(xz_data).hexdigest()
              }
              print(f"Entware {arch}: {len(gz_data)} B -> xz {len(xz_data)} B")

          # 2. Required Entware IPKs + dependencies -> .tar.xz
          WANTED = [
              "libmnl", "libnetfilter-queue", "libnfnetlink", "libcap", "zlib",
              "curl", "flock", "unzip", "iptables", "xtables-addons_legacy",
              "kmod_ndms", "ipset", "openssl-util"
          ]
          def parse_index(raw_text, sub=""):
              pkgs = {}
              for blk in raw_text.strip().split("\n\n"):
                  d = {}
                  for line in blk.splitlines():
                      if ": " in line:
                          k, v = line.split(": ", 1)
                          d[k] = v
                  if "Package" in d:
                      d["_sub"] = sub
                      d["_raw"] = blk
                      pkgs[d["Package"]] = d
              return pkgs

          for arch in ["aarch64-k3.10", "mipselsf-k3.4", "mipssf-k3.4"]:
              raw_main = gzip.decompress(fetch(f"https://bin.entware.net/{arch}/Packages.gz")).decode("utf-8", "replace")
              raw_keen = gzip.decompress(fetch(f"https://bin.entware.net/{arch}/keenetic/Packages.gz")).decode("utf-8", "replace")
              all_p = {**parse_index(raw_main, ""), **parse_index(raw_keen, "keenetic/")}
              seen, q, selected = set(), list(WANTED), []
              while q:
                  cur = q.pop(0)
                  if cur in seen or cur not in all_p:
                      continue
                  seen.add(cur)
                  meta = all_p[cur]
                  selected.append(meta)
                  for dep in meta.get("Depends", "").split(","):
                      dep = re.sub(r"\s*\(.*?\)", "", dep.strip())
                      if dep and dep not in seen:
                          q.append(dep)
              tar_xz_path = base / "ipks" / f"ipks-{arch}.tar.xz"
              tar_buf = io.BytesIO()
              pkg_index_blocks = []
              with tarfile.open(fileobj=tar_buf, mode="w:") as tf:
                  for meta in selected:
                      fn = meta["Filename"]
                      fn_base = pathlib.Path(fn).name
                      url = f"https://bin.entware.net/{arch}/{meta['_sub']}{fn}"
                      ipk_bytes = fetch(url)
                      info = tarfile.TarInfo(name=fn_base)
                      info.size = len(ipk_bytes)
                      tf.addfile(info, io.BytesIO(ipk_bytes))
                      blk_fixed = re.sub(r"(?m)^Filename:.*$", f"Filename: {fn_base}", meta["_raw"])
                      pkg_index_blocks.append(blk_fixed)
                  idx_bytes = ("\n\n".join(pkg_index_blocks) + "\n").encode("utf-8")
                  for idx_name, idx_payload in [("Packages", idx_bytes), ("Packages.gz", gzip.compress(idx_bytes))]:
                      info = tarfile.TarInfo(name=idx_name)
                      info.size = len(idx_payload)
                      tf.addfile(info, io.BytesIO(idx_payload))
              xz_payload = lzma.compress(tar_buf.getvalue(), format=lzma.FORMAT_XZ, preset=9)
              tar_xz_path.write_bytes(xz_payload)
              manifest["ipks"][arch] = {
                  "file": tar_xz_path.name,
                  "count": len(selected),
                  "size": len(xz_payload),
              }
              print(f"IPKs {arch}: {len(selected)} pkgs -> xz {len(xz_payload)} B")

          # 3. z2k-enhanced repo & zapret2 embedded binary (.tar.xz)
          z2k_gz = fetch("https://github.com/necronicle/z2k/archive/refs/heads/z2k-enhanced.tar.gz")
          z2k_xz = gz_to_xz(z2k_gz)
          (base / "z2k" / "z2k-repo.tar.xz").write_bytes(z2k_xz)
          manifest["z2k"]["repo_size"] = len(z2k_xz)

          rel_url = "https://github.com/necronicle/zapret2-z2k/releases/download/v1.0.7-z2k-r0/zapret2-v1.0.7-z2k-r0-openwrt-embedded.tar.gz"
          rel_tag = "v1.0.7-z2k-r0"
          try:
              rel = json.loads(fetch("https://api.github.com/repos/necronicle/zapret2-z2k/releases/latest").decode())
              for a in rel.get("assets", []):
                  if a.get("name", "").endswith("openwrt-embedded.tar.gz"):
                      rel_url = a["browser_download_url"]
                      rel_tag = rel.get("tag_name", rel_tag)
                      break
          except Exception as e:
              print(f"Using fallback zapret2 URL: {e}")
          z2_gz = fetch(rel_url)
          z2_xz = gz_to_xz(z2_gz)
          (base / "z2k" / "zapret2-openwrt-embedded.tar.xz").write_bytes(z2_xz)
          manifest["z2k"]["tag"] = rel_tag
          manifest["z2k"]["zapret2_size"] = len(z2_xz)

          # 4. AdGuard Home latest (v1.0.0+) binary-only .bin.xz per Keenetic arch
          agh_tag = "v1.0.0"
          agh_assets = {}
          try:
              agh_rel = json.loads(fetch("https://api.github.com/repos/AdguardTeam/AdGuardHome/releases/latest").decode())
              agh_tag = agh_rel.get("tag_name", agh_tag)
              for a in agh_rel.get("assets", []):
                  agh_assets[a.get("name", "")] = a.get("browser_download_url", "")
          except Exception as e:
              print(f"Using fallback AdGuardHome {agh_tag}: {e}")

          agh_targets = {
              "aarch64-k3.10": "AdGuardHome_linux_arm64.tar.gz",
              "mipselsf-k3.4": "AdGuardHome_linux_mipsle_softfloat.tar.gz",
              "mipssf-k3.4": "AdGuardHome_linux_mips_softfloat.tar.gz",
          }
          manifest["adguard"]["tag"] = agh_tag
          manifest["adguard"]["arches"] = {}
          for arch, asset_name in agh_targets.items():
              url = agh_assets.get(asset_name) or f"https://github.com/AdguardTeam/AdGuardHome/releases/download/{agh_tag}/{asset_name}"
              tgz = fetch(url)
              bin_bytes = None
              with tarfile.open(fileobj=io.BytesIO(tgz), mode="r:gz") as tf:
                  for m in tf.getmembers():
                      if m.isfile() and m.name.endswith("/AdGuardHome"):
                          bin_bytes = tf.extractfile(m).read()
                          break
              if not bin_bytes:
                  raise RuntimeError(f"AdGuardHome binary missing in {asset_name}")
              bin_xz = lzma.compress(bin_bytes, format=lzma.FORMAT_XZ, preset=9)
              out_name = f"AdGuardHome-{arch}.bin.xz"
              (base / "adguard" / out_name).write_bytes(bin_xz)
              manifest["adguard"]["arches"][arch] = {
                  "file": out_name,
                  "raw_size": len(bin_bytes),
                  "size": len(bin_xz),
                  "sha256": hashlib.sha256(bin_xz).hexdigest(),
              }
              print(f"AdGuardHome {agh_tag} {arch}: bin {len(bin_bytes)} B -> xz {len(bin_xz)} B")

          (base / "manifest.json").write_text(json.dumps(manifest, indent=2))
          print("Offline manifest ready:", json.dumps(manifest))
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode signing keystore (optional)
        env:
          KS_B64: ${{ secrets.GBOX_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | tr -d '\n\r ' | base64 -d > "$RUNNER_TEMP/gbox.p12"
            echo "GBOX_KEYSTORE_PATH=$RUNNER_TEMP/gbox.p12" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK (R8 shrunk)
        env:
          GBOX_STORE_PASS: ${{ secrets.GBOX_STORE_PASS }}
          GBOX_KEY_ALIAS: ${{ secrets.GBOX_KEY_ALIAS }}
          GBOX_KEY_PASS: ${{ secrets.GBOX_KEY_PASS }}
          GBOX_STATS_GIST_ID: ${{ secrets.GBOX_STATS_GIST_ID }}
          GBOX_STATS_TOKEN: ${{ secrets.GBOX_STATS_TOKEN }}
          GBOX_STATS_URL: ${{ secrets.GBOX_STATS_URL }}
          GBOX_DONATE_URL: ${{ secrets.GBOX_DONATE_URL }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Gor4akovNET-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
